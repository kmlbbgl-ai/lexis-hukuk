<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<svg id="d" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"></svg><svg id="s" width="0" height="0"></svg>
<script>window.SAHNE_SADECE=true;const H=Object.fromEntries(location.hash.slice(1).split('&').map(x=>x.split('=')));const DIR='../'+H.d+'/';
['veri_uzun.js'].forEach(f=>document.write(`<script src="${DIR}${f}"><\/script>`));</script>
<script src="ortak.js"></script><script src="parcalar.js"></script><script src="cop.js"></script>
<script>document.write(`<script src="${DIR}sahne.js"><\/script><script src="${DIR}dikey_plan.js"><\/script>`);</script>
<script>
const SC=0.62,SY=560;
function vsub(words,t){const fs=56,maxc=22;let lines=[[]],len=0;
 for(const w of words){if(len+w[0].length>maxc&&lines[lines.length-1].length){lines.push([]);len=0}lines[lines.length-1].push(w);len+=w[0].length+1}
 const y0=1300,h=lines.length*74+36,wm=Math.max(...lines.map(l=>l.map(w=>w[0]).join(' ').length))*fs*0.53;
 let o=`<rect x="${540-wm/2-36}" y="${y0}" width="${wm+72}" height="${h}" rx="22" fill="rgba(10,14,20,.84)"/>`;
 lines.forEach((l,i)=>{o+=`<text x="540" y="${y0+72+i*74}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="${fs}">${l.map(([s,a,b])=>`<tspan fill="${t>=a-0.03&&t<b+0.05?'#FFD23F':'#FFFFFF'}">${s} </tspan>`).join('')}</text>`});return o}
window.dikey=function(ver,T){
 const p=PLAN[ver];const GC=p.kapanis.tema=='gece';const C1=GC?'#5CE1E6':G,C2=GC?'#FFC857':B,CF=GC?'#24395A':G,KB=GC?'#0D1B2A':'#FFF8E7';
 let o=DEFS+(GC?`<rect width="1080" height="1920" fill="#0D1B2A"/>`+ros(540,300,260,60,180,6,'#5CE1E6',.06)+ros(540,1650,260,60,180,6,'#FFC857',.05):`<rect width="1080" height="1920" fill="${P}"/>`+ros(540,300,260,60,180,6,G,.08)+ros(540,1650,260,60,180,6,B,.07));
 const z=p.zam.find(z=>T>=z.t0&&T<z.t1)||p.zam[p.zam.length-1];
 o+=`<text x="540" y="200" text-anchor="middle" font-family="Inter" font-weight="800" font-size="30" letter-spacing="10" fill="${AU}">MERAKOLOJİ</text>`;
 p.ust.forEach((s,i)=>o+=`<text x="540" y="${320+i*100}" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="${s.length>20?70:82}" fill="${i?C2:C1}">${s}</text>`);
 let words=null;
 if(z.gorsel=='sahne'){const tv=z.s0+Math.min(T,z.t1)-z.t0;
  o+=`<defs><clipPath id="kutu"><rect width="1920" height="1080"/></clipPath></defs><g transform="translate(${540-960*SC},${SY}) scale(${SC})"><g clip-path="url(#kutu)">${draw(tv)}</g><rect width="1920" height="1080" fill="none" stroke="${CF}" stroke-width="8"/></g>`;
  const c=(window.SUB||[]).find(c=>tv>=c.t0-0.05&&tv<c.t1); if(c&&T<z.t1)words=c.w.map(([s,a,b])=>[s,a-z.s0+z.t0,b-z.s0+z.t0]);
 } else { // kapanış kartı
  const k=cl((T-z.t0)/0.35),K=p.kapanis;
  o+=`<g opacity="${k}">${ros(540,900,300,70,220,6,G,.1)}<g transform="translate(540,880) rotate(-6) scale(${1+1.1*(1-out3(cl((T-z.t0-0.1)/0.35)))})"><circle r="260" fill="${KB}" stroke="${C2}" stroke-width="14"/><circle r="230" fill="none" stroke="${C2}" stroke-width="3"/>
   ${K.satir.map((s,i)=>`<text y="${-40+i*90-(K.satir.length-2)*45}" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="${s.length>9?56:70}" fill="${i?C1:C2}">${s}</text>`).join('')}</g>
   ${K.damga&&T>z.t0+K.dz?`<g transform="translate(560,1230) rotate(-8) scale(${1+1.3*(1-out3(cl((T-z.t0-K.dz)/0.3)))})" opacity="${cl((T-z.t0-K.dz)/0.3)}"><rect x="-300" y="-62" width="600" height="110" rx="14" fill="${KB}" stroke="${GC?'#7BE38F':G2}" stroke-width="9"/><text y="18" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="${K.damga.length>14?50:60}" fill="${GC?'#7BE38F':G2}">${K.damga}</text></g>`:''}
   <g transform="translate(540,1460)"><rect x="-330" y="-56" width="660" height="112" rx="56" fill="${ver=='yt'?'#E53935':'#7E57C2'}"/><text y="20" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="50" fill="#fff">${ver=='yt'?K.yt:K.ig}</text></g></g>`;
  const c=(z.sub||[]); const cc=c.find(c=>T>=c.t0-0.05&&T<c.t1); if(cc)words=cc.w;
 }
 if(words&&z.gorsel=='sahne')o+=vsub(words,T);
 o+=`<rect x="20" y="20" width="1040" height="1880" fill="none" stroke="${CF}" stroke-width="5"/>${GC?'':'<rect width="1080" height="1920" fill="url(#vig)"/>'}`;
 if(T<0.25)o+=`<rect width="1080" height="1920" fill="#000" opacity="${1-T/0.25}"/>`;
 if(T>p.sure-0.35)o+=`<rect width="1080" height="1920" fill="#000" opacity="${cl((T-p.sure+0.35)/0.35)}"/>`;
 document.getElementById('d').innerHTML=o;};
window.draw2=window.dikey;
</script></body></html>

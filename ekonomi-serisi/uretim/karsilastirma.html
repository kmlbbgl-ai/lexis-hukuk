<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<svg id="s" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>window.SUB=[];</script><script src="ortak.js"></script>
<script>
const HAR='#C49A2C',BOR='#8C2F39';
const shoe=(x,y,s,r=0)=>`<g transform="translate(${x},${y}) rotate(${r}) scale(${s})"><path d="M -80 20 v -50 q 0 -24 24 -24 h 26 q 14 34 64 40 q 52 6 70 34 v 20 z" fill="#5a3a17" stroke="${INK}" stroke-width="6"/><rect x="-86" y="20" width="190" height="16" rx="6" fill="${INK}"/></g>`;
const spark=(x,y)=>[[0,-40],[34,-20],[-34,-20]].map(([dx,dy])=>`<text x="${x+dx}" y="${y+dy}" text-anchor="middle" font-size="30" fill="${AU}">✦</text>`).join('');
const tagK=(x,y)=>`<g transform="translate(${x},${y}) rotate(-10)"><circle r="62" fill="#FFF8E7" stroke="${B}" stroke-width="7"/><text y="16" text-anchor="middle" font-family="Bitstream Charter" font-weight="bold" font-size="46" fill="${B}">%50</text></g>`;
const counter=(x,y)=>`<rect x="${x-110}" y="${y-110}" width="220" height="110" fill="#8A5A3B" stroke="${INK}" stroke-width="5"/>`;
const L=(x1,y1,x2,y2,w=12,c=INK)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
function stick(x,y,s,pose){ // y = ayak tabanı
 let o=`<g transform="translate(${x},${y}) scale(${s})" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">`;
 o+=`<circle cx="0" cy="-300" r="48" fill="${P}"/><line x1="0" y1="-252" x2="0" y2="-120"/>`;
 if(pose=='jump') o+=`<path d="M 0 -230 L -70 -310 L -60 -380"/><path d="M 0 -230 L 70 -310 L 60 -380"/><path d="M 0 -120 L -50 -60 L -30 0"/><path d="M 0 -120 L 50 -70 L 80 -20"/>`;
 else o+=`<path d="M 0 -230 L -60 -170"/><path d="M 0 -230 L 70 -290 L 90 -350"/><path d="M 0 -120 L -40 0"/><path d="M 0 -120 L 40 0"/>`;
 return o+`</g>`}
function panel(i,title,sub,body){const x0=40+i*620;
 return `<g><rect x="${x0}" y="250" width="600" height="700" rx="18" fill="#FFF8E7" fill-opacity=".55" stroke="${G}" stroke-width="4"/>
 <text x="${x0+300}" y="320" text-anchor="middle" font-family="Inter" font-weight="900" font-size="34" fill="${G}">${title}</text>
 <text x="${x0+300}" y="360" text-anchor="middle" font-family="Inter" font-weight="600" font-size="22" fill="${B}">${sub}</text>
 <line x1="${x0+30}" y1="850" x2="${x0+570}" y2="850" stroke="${G}" stroke-width="3"/>${body(x0)}</g>`}
function ciz(){
 let o=DEFS+BG+`<text x="960" y="110" text-anchor="middle" font-family="Inter" font-weight="800" font-size="28" letter-spacing="10" fill="${AU}">AYNI SAHNE · ÜÇ TARZ</text><text x="960" y="190" text-anchor="middle" font-family="Bitstream Charter" font-weight="bold" font-size="58" fill="${G}">"Efsane indirim!" — ayakkabıyla sevinç</text>`;
 // 1 klasik piyon
 o+=panel(0,'1 · KLASİK PİYON','kolsuz · duygu zıplama ve simgeyle',x=>{
  return counter(x+450,850)+pawn(x+450,740,.48,BOR,`<rect x="-60" y="-150" width="120" height="110" rx="10" fill="#fff" stroke="${INK}" stroke-width="4"/>`)+
   pawn(x+200,800,.7,HAR,`<rect x="60" y="-110" width="70" height="80" rx="8" fill="#C98B4E" stroke="${INK}" stroke-width="4"/>`)+`<ellipse cx="${x+200}" cy="850" rx="60" ry="10" fill="${INK}" opacity=".15"/>`+
   shoe(x+210,520,.8,-8)+spark(x+215,500)+tagK(x+420,500)+`<path d="M ${x+120} 560 q -20 -20 0 -40 M ${x+290} 560 q 20 -20 0 -40" stroke="${INK}" stroke-width="5" fill="none"/>`;});
 // 2 çöp adam
 o+=panel(1,'2 · SİYAH ÇÖP ADAM','kollu bacaklı · çok ifadeli ama yaygın',x=>{
  return stick(x+450,800,.55,'wave')+counter(x+450,850)+stick(x+200,800,.75,'jump')+`<ellipse cx="${x+200}" cy="850" rx="60" ry="10" fill="${INK}" opacity=".15"/>`+
   shoe(x+200,470,.8,-8)+spark(x+205,450)+tagK(x+420,500);});
 // 3 kollu piyon
 o+=panel(2,'3 · KOLLU PİYON ⭐','piyon gövdesi + çöp adam kolları',x=>{
  const arms=`${L(-70,-150,-140,-260)}${L(70,-150,140,-260)}`;
  const legs=`${L(-36,6,-60,60,11)}${L(36,6,70,46,11)}`;
  return counter(x+450,850)+pawn(x+450,740,.48,BOR,`<rect x="-60" y="-150" width="120" height="110" rx="10" fill="#fff" stroke="${INK}" stroke-width="4"/>${L(70,-150,150,-250)}${L(150,-250,130,-300,11)}`)+
   pawn(x+200,770,.7,HAR,`${arms}${legs}<rect x="60" y="-110" width="70" height="80" rx="8" fill="#C98B4E" stroke="${INK}" stroke-width="4"/>`)+`<ellipse cx="${x+200}" cy="850" rx="60" ry="10" fill="${INK}" opacity=".15"/>`+
   shoe(x+200,520,.8,-8)+spark(x+205,500)+tagK(x+420,500);});
 o+=`<text x="960" y="1010" text-anchor="middle" font-family="Inter" font-weight="600" font-size="28" fill="${G}">Önerim 3: kanalın ayırt edici piyonu korunur, kollar sayesinde ifade gücü artar.</text>`;
 return o+BORDER+`<rect width="1920" height="1080" fill="url(#vig)"/>`}
document.getElementById('s').innerHTML=ciz();
</script></body></html>

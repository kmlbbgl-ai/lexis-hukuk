<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<svg id="s" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>window.SUB=[];</script><script src="ortak.js"></script>
<script>
const HAR='#C49A2C',BOR='#8C2F39',KIR='#B5562E',GRI='#8A8F8C',LAC='#2E4A6B',CY='#2F6B55';
const pl=(pts,w,c)=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
// çöp adam: baş (0,-300) r48, omuz (0,-230), kalça (0,-120). headFill: palet rengi. front/back: dolu eşyalar
function cop(x,y,s,o){const c=o.c||INK,w=12;
 let g=`<g transform="translate(${x},${y}) scale(${s})">`+(o.back||'');
 g+=pl([[0,-252],[0,-120]],w,c)+pl([[0,-230],...o.la],w,c)+pl([[0,-230],...o.ra],w,c)+pl([[0,-120],...o.ll],w,c)+pl([[0,-120],...o.rl],w,c);
 g+=`<circle cx="0" cy="-300" r="48" fill="${o.head||P}" stroke="${c}" stroke-width="${w}"/><path d="M -24 -322 a 30 30 0 0 1 30 -12" stroke="#fff" stroke-width="7" fill="none" opacity=".45" stroke-linecap="round"/>`;
 return g+(o.front||'')+`</g>`}
const lbl=(x,y,t,sub)=>`<rect x="${x-130}" y="${y-30}" width="260" height="52" rx="26" fill="${INK}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="24" fill="#FFD23F">${t}</text><text x="${x}" y="${y+56}" text-anchor="middle" font-family="Inter" font-weight="600" font-size="20" fill="${G}">${sub}</text>`;
function ciz(){
 let o=DEFS+BG+`<text x="960" y="110" text-anchor="middle" font-family="Inter" font-weight="800" font-size="28" letter-spacing="10" fill="${AU}">STANDART KARAKTER</text><text x="960" y="185" text-anchor="middle" font-family="Bitstream Charter" font-weight="bold" font-size="58" fill="${G}">Çöp adam + dolu, renkli eşyalar</text>`;
 const y=800,s=.9,X=[220,520,820,1110,1400,1700];
 // DEDE: kırmızı takke (dolu), kalın baston, kambur
 o+=cop(X[0],y,s,{head:'#EBDDBB',la:[[-50,-160],[-60,-100]],ra:[[60,-170],[100,-120]],ll:[[-40,0]],rl:[[40,0]],
  front:`<path d="M -48 -322 q 48 -62 96 0 z" fill="${BOR}" stroke="${INK}" stroke-width="6"/><circle cx="0" cy="-372" r="7" fill="${BOR}" stroke="${INK}" stroke-width="4"/>
  <line x1="100" y1="-120" x2="120" y2="0" stroke="#6B4A2B" stroke-width="16" stroke-linecap="round"/><path d="M 100 -120 q -6 -34 26 -40" fill="none" stroke="#6B4A2B" stroke-width="16" stroke-linecap="round"/>`})+lbl(X[0],y+70,'DEDE','kırmızı takke · baston');
 // ÖĞRETMEN: kalın gözlük, kitap, tebeşir
 o+=cop(X[1],y,s,{head:'#EBDDBB',la:[[-60,-170],[-30,-120]],ra:[[70,-290],[110,-340]],ll:[[-40,0]],rl:[[40,0]],
  front:`<circle cx="-20" cy="-300" r="18" fill="#dfeef2" stroke="${INK}" stroke-width="7"/><circle cx="20" cy="-300" r="18" fill="#dfeef2" stroke="${INK}" stroke-width="7"/>
  <rect x="-70" y="-160" width="70" height="86" rx="6" fill="${CY}" stroke="${INK}" stroke-width="5"/><line x1="-35" y1="-160" x2="-35" y2="-74" stroke="${P}" stroke-width="4"/>
  <rect x="104" y="-370" width="14" height="44" rx="4" fill="#fff" stroke="${INK}" stroke-width="4" transform="rotate(30 110 -348)"/>`})+lbl(X[1],y+70,'ÖĞRETMEN','gözlük · kitap · tebeşir');
 // ANNE: topuz, dolu çanta, etek (üçgen gövde)
 o+=cop(X[2],y,s,{head:'#EBDDBB',la:[[-60,-160],[-70,-110]],ra:[[60,-160],[80,-110]],ll:[[-30,0]],rl:[[30,0]],
  back:`<circle cx="0" cy="-358" r="26" fill="${KIR}" stroke="${INK}" stroke-width="6"/>`,
  front:`<path d="M 0 -230 l -55 115 h 110 z" fill="${KIR}" stroke="${INK}" stroke-width="6"/><rect x="62" y="-110" width="64" height="56" rx="10" fill="${HAR}" stroke="${INK}" stroke-width="5"/><path d="M 72 -110 q 22 -34 44 0" fill="none" stroke="${INK}" stroke-width="5"/>`})+lbl(X[2],y+70,'ANNE','topuz · elbise · çanta');
 // KRAL: altın taç, bordo pelerin
 o+=cop(X[3],y,s,{head:'#FFD23F',la:[[-60,-170],[-80,-110]],ra:[[70,-280],[100,-330]],ll:[[-40,0]],rl:[[40,0]],
  back:`<path d="M -10 -236 q -90 60 -80 236 h 180 q 10 -176 -80 -236 z" fill="${BOR}" stroke="${INK}" stroke-width="6"/>`,
  front:`<path d="M -46 -336 l 0 -40 l 23 20 l 23 -34 l 23 34 l 23 -20 l 0 40 z" fill="#FFD23F" stroke="${INK}" stroke-width="6"/><circle cx="0" cy="-352" r="6" fill="${BOR}"/>`})+lbl(X[3],y+70,'KARUN','altın taç · pelerin · altın kafa');
 // POLİS: lacivert şapka, düdük
 o+=cop(X[4],y,s,{head:'#EBDDBB',la:[[-60,-170],[-60,-110]],ra:[[60,-260],[20,-300]],ll:[[-40,0]],rl:[[40,0]],
  front:`<path d="M -56 -330 h 112 l -10 -44 q -46 -18 -92 0 z" fill="${LAC}" stroke="${INK}" stroke-width="6"/><rect x="-62" y="-336" width="124" height="14" rx="6" fill="${INK}"/><circle cx="0" cy="-356" r="9" fill="#FFD23F"/><rect x="18" y="-310" width="30" height="14" rx="5" fill="#ccc" stroke="${INK}" stroke-width="3"/>`})+lbl(X[4],y+70,'POLİS','şapka · düdük');
 // KAYBEDEN: gri, solmuş çizgi, eriyen para
 o+=cop(X[5],y,s,{c:GRI,head:'#cfd2d0',la:[[-40,-150],[-50,-90]],ra:[[90,-190]],ll:[[-30,0]],rl:[[30,0]],
  front:`<g transform="translate(140,-200)"><rect x="-44" y="-14" width="88" height="34" rx="4" fill="${NOTE}" stroke="${GRI}" stroke-width="3"/>${[-24,0,24].map(d=>`<path d="M ${d} 20 q 5 18 0 30" stroke="${NOTE}" stroke-width="9" stroke-linecap="round" fill="none"/>`).join('')}</g><text x="-90" y="-380" font-family="Bitstream Charter" font-weight="bold" font-size="70" fill="${GRI}">…</text>`},)+lbl(X[5],y+70,'KAYBEDEN','gri, solmuş · eriyen para');
 o+=`<line x1="80" y1="${y+2}" x2="1840" y2="${y+2}" stroke="${G}" stroke-width="3" opacity=".5"/>`;
 return o+BORDER+`<rect width="1920" height="1080" fill="url(#vig)"/>`}
document.getElementById('s').innerHTML=ciz();
</script></body></html>

name: Vakit Android APK

on:
  push:
    paths:
      - "vakit/**"
      - ".github/workflows/vakit-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vakit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vakit-debug-apk
          path: vakit/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish single download link (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vakit.apk
          gh release delete vakit-latest --yes --cleanup-tag || true
          gh release create vakit-latest vakit.apk --prerelease --target "$GITHUB_SHA" \
            --title "Vakit (deneme sürümü)" \
            --notes "En son deneme sürümü. Telefondan vakit.apk dosyasına dokunup indirin ve kurun."
